<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f97316" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <title>GymTracker — Início</title>
  <link rel="stylesheet" href="css/global.css" />
  <style>
    [hidden] { display: none !important; }
    .content { padding: 24px 0 64px; }

    /* Splash screen (aparece só na primeira carga do PWA) */
    #app-splash {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #app-splash img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
    }
    #app-splash .splash-nome {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: 0.02em;
    }
    #app-splash .splash-nome span { color: var(--orange); }
    #app-splash .splash-sub {
      color: var(--text-3);
      font-size: 0.85rem;
      margin-top: -12px;
    }
    #app-splash.hide {
      opacity: 0;
      pointer-events: none;
    }

    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 2px;
    }

    /* ── Topo ─────────────────────────────────────────── */
    .topo {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    .topo h1 { font-size: 1.9rem; line-height: 1.1; }
    .topo p { color: var(--text-2); font-size: 14px; margin-top: 4px; }

    .ajustes-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--bg-3);
      border: 1px solid var(--border);
      color: var(--text-2);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .ajustes-menu {
      position: absolute;
      top: 50px;
      right: 0;
      z-index: 50;
      min-width: 210px;
      padding: 6px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 12px 32px rgba(0,0,0,.5);
    }
    .ajustes-menu a, .ajustes-menu button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 13px 12px;
      background: none;
      border: 0;
      border-radius: 8px;
      color: var(--text);
      font: 500 15px/1.2 'Inter', system-ui, sans-serif;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
    }
    .ajustes-menu a:active, .ajustes-menu button:active { background: var(--bg-3); }
    .ajustes-menu .sair { color: var(--red, #ef4444); }

    @media (max-width: 768px) {
      .content { padding: 20px 0 48px; }
      .ajustes-btn { display: flex; }
    }

    /* ── Layout ───────────────────────────────────────── */
    .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
    .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    @media (min-width: 900px) {
      .layout { grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 24px; align-items: start; }
    }

    .bloco {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 16px;
    }

    /* ── Faixa da semana ──────────────────────────────── */
    .semana-topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .semana-titulo { font-weight: 600; font-size: 14px; color: var(--text-2); }
    .nav-sem {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: none;
      border: 0;
      color: var(--text-2);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-sem:disabled { opacity: .25; cursor: default; }

    .semana-dias {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
    }
    .dia { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .dia-letra { font-size: 12px; font-weight: 600; color: var(--text-3); }
    .dia-num {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }
    .dia.futuro .dia-num { color: var(--text-3); }
    .dia.hoje .dia-num { background: var(--orange); color: #fff; }
    .dia-ponto { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
    .dia.treinou .dia-ponto { background: var(--orange); }

    .meta-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 10px 8px;
      background: none;
      border: 0;
      color: var(--text-2);
      font: 500 13px/1.3 'Inter', system-ui, sans-serif;
      text-align: center;
      cursor: pointer;
    }
    .meta-btn.batida { color: var(--orange); }
    .meta-editor {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 4px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-2);
    }
    .meta-editor button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-3);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }
    .meta-editor button:disabled { opacity: .3; cursor: default; }
    .meta-valor {
      min-width: 22px;
      text-align: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
    }

    /* ── Treino de hoje ───────────────────────────────── */
    .hoje {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-color: var(--orange);
    }
    .hoje-info { min-width: 0; }
    .hoje-rotulo { font-size: 13px; color: var(--text-2); }
    .hoje-nome {
      margin-top: 2px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }
    .hoje-sub { margin-top: 4px; font-size: 13px; color: var(--text-2); }
    .hoje .btn { flex-shrink: 0; }

    .outra-btn {
      display: block;
      width: 100%;
      margin-top: -4px;
      padding: 12px;
      background: none;
      border: 0;
      color: var(--text-2);
      font: 500 14px/1.2 'Inter', system-ui, sans-serif;
      cursor: pointer;
    }
    .outras { display: flex; flex-direction: column; gap: 8px; margin-top: -4px; }

    .ficha-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color .15s;
      cursor: pointer;
      text-decoration: none;
    }
    .ficha-item:hover { border-color: var(--orange); }
    .ficha-item-info { flex: 1; min-width: 0; }
    .ficha-item-nome { font-weight: 600; font-size: 15px; color: var(--text); }
    .ficha-item-sub { font-size: 12px; color: var(--text-2); margin-top: 2px; }
    .ficha-item .arrow { color: var(--text-3); font-size: 18px; }
    .ficha-item:hover .arrow { color: var(--orange); }

    /* ── Sequência ────────────────────────────────────── */
    .seq { display: flex; align-items: center; gap: 16px; }
    .seq-num {
      min-width: 44px;
      text-align: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2.4rem;
      font-weight: 700;
      line-height: 1;
      color: var(--orange);
    }
    .seq-titulo { font-weight: 600; font-size: 15px; }
    .seq-sub { margin-top: 3px; font-size: 13px; color: var(--text-2); }

    /* ── Últimos treinos ──────────────────────────────── */
    .bloco-topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .bloco-titulo { font-weight: 600; font-size: 15px; }
    .sessao-item { padding: 14px 0; border-bottom: 1px solid var(--border); }
    .sessao-item:last-child { border-bottom: none; padding-bottom: 0; }
    .sessao-item-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .sessao-item-nome { font-weight: 600; font-size: 14px; }
    .sessao-item-data { font-size: 12px; color: var(--text-3); white-space: nowrap; }
    .sessao-item-meta { font-size: 12px; color: var(--text-2); margin-top: 4px; }
    .badge-pr {
      display: inline-block;
      margin-left: 8px;
      padding: 1px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      color: var(--orange);
      background: var(--orange-glow);
    }
    .vazio { color: var(--text-3); text-align: center; padding: 24px 8px; font-size: 14px; }
  </style>
</head>
<body>

  <!-- Splash screen: some depois que a página carregar -->
  <div id="app-splash">
    <img src="/icons/icon-192.png" alt="GymTracker" />
    <div class="splash-nome">GYM<span>TRACKER</span></div>
    <div class="splash-sub">Train Smarter.</div>
  </div>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a class="navbar-brand" href="/dashboard.html">Gym<span>Tracker</span></a>
    <div class="navbar-nav">
      <a href="/dashboard.html" class="active">Início</a>
      <a href="/fichas.html">Fichas</a>
      <a href="/treino.html">Treinar</a>
      <a href="/historico.html">Histórico</a>
      <a href="/relatorio.html">Relatório</a>
      <a href="/perfil.html">Perfil</a>
    </div>
    <div class="flex gap-8">
      <span id="user-nome" style="font-size:13px;color:var(--text-2)"></span>
      <button class="btn btn-ghost btn-sm" onclick="sair()">Sair</button>
    </div>
  </nav>

  <div class="page-wrapper">
    <div class="content">

      <!-- Topo -->
      <div class="topo">
        <div>
          <h1>Início</h1>
          <p id="data-hoje"></p>
        </div>
        <button type="button" class="ajustes-btn" id="ajustes-btn" aria-label="Ajustes" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>
          </svg>
        </button>
        <div class="ajustes-menu" id="ajustes-menu" role="menu" hidden>
          <a href="/perfil.html" role="menuitem">Perfil</a>
          <a href="/avaliacao-fisica.html" role="menuitem">Avaliação física</a>
          <button type="button" class="sair" role="menuitem" onclick="sair()">Sair</button>
        </div>
      </div>

      <div class="layout">

        <!-- Esquerda: semana, treino de hoje, sequência -->
        <div class="col">

          <section class="bloco" aria-label="Semana">
            <div class="semana-topo">
              <button type="button" class="nav-sem" id="sem-ant" aria-label="Semana anterior">‹</button>
              <div class="semana-titulo" id="sem-titulo">Esta semana</div>
              <button type="button" class="nav-sem" id="sem-prox" aria-label="Próxima semana">›</button>
            </div>
            <div class="semana-dias" id="sem-dias"></div>
            <button type="button" class="meta-btn" id="meta-btn" aria-expanded="false"></button>
            <div class="meta-editor" id="meta-editor" hidden>
              <span>Treinos por semana</span>
              <button type="button" id="meta-menos" aria-label="Diminuir meta">−</button>
              <span class="meta-valor" id="meta-valor">3</span>
              <button type="button" id="meta-mais" aria-label="Aumentar meta">+</button>
            </div>
          </section>

          <section id="hoje-area" aria-label="Treino de hoje"></section>

          <section class="bloco seq" aria-label="Sequência">
            <div class="seq-num" id="seq-num">0</div>
            <div>
              <div class="seq-titulo" id="seq-titulo">semanas seguidas na meta</div>
              <div class="seq-sub" id="seq-sub"></div>
            </div>
          </section>

        </div>

        <!-- Direita: últimos treinos -->
        <div class="col">
          <section class="bloco" aria-label="Últimos treinos">
            <div class="bloco-topo">
              <div class="bloco-titulo">Últimos treinos</div>
              <a href="/historico.html" class="btn btn-ghost btn-sm">Ver histórico</a>
            </div>
            <div id="sessoes-lista"><div class="vazio">Carregando...</div></div>
          </section>
        </div>

      </div>
    </div>
  </div>

  <script type="module">
    import { supabase, requireAuth } from './js/supabase.js';
    import { StatisticsEngine, chaveDiaLocal, inicioDaSemana, addDias } from './js/StatisticsEngine.js';
    import { WorkoutService } from './js/WorkoutService.js';

    const splashInicio = Date.now();
    function esconderSplash() {
      const tempoRestante = Math.max(0, 500 - (Date.now() - splashInicio));
      setTimeout(() => {
        const splash = document.getElementById('app-splash');
        if (!splash) return;
        splash.classList.add('hide');
        setTimeout(() => splash.remove(), 450);
      }, tempoRestante);
    }
    // Rede de segurança: nunca deixa a splash travada na tela, mesmo se
    // algo der errado no carregamento dos dados abaixo.
    setTimeout(esconderSplash, 6000);

    window.sair = async () => {
      await supabase.auth.signOut();
      window.location.href = '/index.html';
    };

    const user = await requireAuth();
    if (!user) { window.location.href = "/index.html"; throw new Error("unauth"); }

    const nome = user.user_metadata?.nome || user.email.split('@')[0];
    document.getElementById('user-nome').textContent = nome;

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
    const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
    const $ = id => document.getElementById(id);

    // Data de hoje
    const dataTxt = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
    $('data-hoje').textContent = dataTxt.charAt(0).toUpperCase() + dataTxt.slice(1);

    // ── Menu de ajustes (só aparece no celular) ──────────
    const ajustesBtn = $('ajustes-btn');
    const ajustesMenu = $('ajustes-menu');
    function fecharAjustes() {
      ajustesMenu.hidden = true;
      ajustesBtn.setAttribute('aria-expanded', 'false');
    }
    ajustesBtn.addEventListener('click', e => {
      e.stopPropagation();
      const abrir = ajustesMenu.hidden;
      ajustesMenu.hidden = !abrir;
      ajustesBtn.setAttribute('aria-expanded', String(abrir));
    });
    document.addEventListener('click', e => {
      if (!ajustesMenu.hidden && !ajustesMenu.contains(e.target)) fecharAjustes();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharAjustes(); });

    // ── Dados ────────────────────────────────────────────
    let contagens, sessoesAll, fichas, ultimas;
    try {
      [contagens, sessoesAll, fichas, ultimas] = await Promise.all([
        StatisticsEngine.contagens(user.id),
        StatisticsEngine.sessoesDesde(user.id, addDias(new Date(), -400).toISOString()),
        WorkoutService.listarFichas(user.id),
        StatisticsEngine.listarSessoes(user.id, 5)
      ]);
    } catch (err) {
      console.error('Falha ao carregar o Início:', err);
      $('sessoes-lista').innerHTML = '<div class="vazio">Não foi possível carregar os dados. Feche e abra o app para tentar de novo.</div>';
      esconderSplash();
      throw err;
    }

    // Treinos por dia (fuso local)
    const porDia = new Map();
    sessoesAll.forEach(s => {
      const k = chaveDiaLocal(new Date(s.iniciado_em));
      porDia.set(k, (porDia.get(k) || 0) + 1);
    });

    // ── Meta semanal (padrão: nº de fichas ativas; salva no aparelho) ──
    const META_CHAVE = 'gt_meta_semanal';
    function lerMeta() {
      try {
        const v = parseInt(localStorage.getItem(META_CHAVE), 10);
        if (v >= 1 && v <= 7) return v;
      } catch (e) { /* sem storage: usa o padrão */ }
      return Math.min(7, Math.max(1, fichas.length || 3));
    }
    function salvarMeta(v) {
      try { localStorage.setItem(META_CHAVE, String(v)); } catch (e) { /* ignora */ }
    }
    let meta = lerMeta();
    let offset = 0; // 0 = esta semana, -1 = semana passada...
    const OFFSET_MIN = -52;

    // ── Faixa da semana ──────────────────────────────────
    const LETRAS = ['S', 'T', 'Q', 'Q', 'S', 'S', 'D'];
    const NOMES = ['segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado', 'domingo'];

    function renderSemana() {
      const agora = new Date();
      const hojeKey = chaveDiaLocal(agora);
      const ini = addDias(inicioDaSemana(agora), offset * 7);

      let total = 0;
      let html = '';
      for (let i = 0; i < 7; i++) {
        const d = addDias(ini, i);
        const key = chaveDiaLocal(d);
        const n = porDia.get(key) || 0;
        total += n;
        const cls = ['dia'];
        if (key === hojeKey) cls.push('hoje');
        if (key > hojeKey) cls.push('futuro');
        if (n > 0) cls.push('treinou');
        html += `<div class="${cls.join(' ')}" title="${NOMES[i]}, ${d.getDate()}${n ? ' — treinou' : ''}">
          <span class="dia-letra">${LETRAS[i]}</span>
          <span class="dia-num">${d.getDate()}</span>
          <span class="dia-ponto"></span>
        </div>`;
      }
      $('sem-dias').innerHTML = html;

      $('sem-titulo').textContent =
        offset === 0 ? 'Esta semana' :
        offset === -1 ? 'Semana passada' :
        'Semana de ' + ini.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' });
      $('sem-prox').disabled = offset >= 0;
      $('sem-ant').disabled = offset <= OFFSET_MIN;

      const metaBtn = $('meta-btn');
      metaBtn.classList.remove('batida');
      if (offset === 0) {
        const falta = meta - total;
        if (falta > 0) {
          metaBtn.textContent = `Faltam ${falta} de ${meta} nesta semana`;
        } else {
          metaBtn.textContent = `Meta da semana batida: ${total} de ${meta}`;
          metaBtn.classList.add('batida');
        }
      } else {
        metaBtn.textContent = `${plural(total, 'treino', 'treinos')} nessa semana (meta ${meta})`;
      }
      $('meta-valor').textContent = meta;
      $('meta-menos').disabled = meta <= 1;
      $('meta-mais').disabled = meta >= 7;
    }

    $('sem-ant').addEventListener('click', () => { if (offset > OFFSET_MIN) { offset--; renderSemana(); } });
    $('sem-prox').addEventListener('click', () => { if (offset < 0) { offset++; renderSemana(); } });
    $('meta-btn').addEventListener('click', () => {
      const editor = $('meta-editor');
      editor.hidden = !editor.hidden;
      $('meta-btn').setAttribute('aria-expanded', String(!editor.hidden));
    });
    function mudarMeta(delta) {
      const novo = Math.min(7, Math.max(1, meta + delta));
      if (novo === meta) return;
      meta = novo;
      salvarMeta(meta);
      renderSemana();
      renderSequencia();
    }
    $('meta-menos').addEventListener('click', () => mudarMeta(-1));
    $('meta-mais').addEventListener('click', () => mudarMeta(1));

    // ── Treino de hoje: próxima ficha na rotação ─────────
    function proximaFicha() {
      if (!fichas.length) return null;
      const ultima = sessoesAll[0]; // mais recente primeiro
      let idx = -1;
      if (ultima) {
        if (ultima.ficha_id) idx = fichas.findIndex(f => f.id === ultima.ficha_id);
        if (idx === -1 && ultima.ficha_nome) idx = fichas.findIndex(f => f.nome === ultima.ficha_nome);
      }
      return fichas[(idx + 1) % fichas.length]; // idx -1 → primeira ficha
    }

    function renderHoje() {
      const area = $('hoje-area');
      const prox = proximaFicha();
      if (!prox) {
        area.innerHTML = `
          <div class="bloco">
            <div class="vazio" style="padding:8px 0 16px">Nenhuma ficha criada ainda.</div>
            <a href="/fichas.html" class="btn btn-primary" style="display:flex;justify-content:center">Criar primeira ficha</a>
          </div>`;
        return;
      }
      const treinouHoje = (porDia.get(chaveDiaLocal(new Date())) || 0) > 0;
      const outras = fichas.length > 1;
      area.innerHTML = `
        <div class="bloco hoje">
          <div class="hoje-info">
            <div class="hoje-rotulo">${treinouHoje ? 'Próximo treino' : 'Hoje'}</div>
            <div class="hoje-nome">${esc(prox.nome)}</div>
            ${prox.descricao ? `<div class="hoje-sub">${esc(prox.descricao)}</div>` : ''}
          </div>
          <a href="/treino.html?ficha=${encodeURIComponent(prox.id)}" class="btn btn-primary btn-lg">Começar</a>
        </div>
        ${outras ? `<button type="button" class="outra-btn" id="outra-btn" aria-expanded="false">Escolher outra ficha</button>
        <div class="outras" id="outras" hidden>
          ${fichas.map(f => `
            <a class="ficha-item" href="/treino.html?ficha=${encodeURIComponent(f.id)}">
              <div class="ficha-item-info">
                <div class="ficha-item-nome">${esc(f.nome)}</div>
                ${f.descricao ? `<div class="ficha-item-sub">${esc(f.descricao)}</div>` : ''}
              </div>
              <div class="arrow">›</div>
            </a>`).join('')}
        </div>` : ''}`;
      const outraBtn = $('outra-btn');
      if (outraBtn) {
        outraBtn.addEventListener('click', () => {
          const lista = $('outras');
          lista.hidden = !lista.hidden;
          outraBtn.setAttribute('aria-expanded', String(!lista.hidden));
          outraBtn.textContent = lista.hidden ? 'Escolher outra ficha' : 'Fechar lista';
        });
      }
    }

    // ── Sequência em semanas ─────────────────────────────
    function renderSequencia() {
      const n = StatisticsEngine.sequenciaSemanas(sessoesAll, meta);
      $('seq-num').textContent = n;
      $('seq-titulo').textContent = n === 1 ? 'semana seguida na meta' : 'semanas seguidas na meta';
      $('seq-sub').textContent =
        `${plural(contagens.totalSessoes, 'treino', 'treinos')} no total · ` +
        `${plural(contagens.totalPRs, 'recorde', 'recordes')}`;
    }

    // ── Últimos treinos ──────────────────────────────────
    function renderUltimos() {
      const el = $('sessoes-lista');
      if (!ultimas?.length) {
        el.innerHTML = '<div class="vazio">Nenhum treino registrado ainda.</div>';
        return;
      }
      el.innerHTML = ultimas.map(s => {
        const data = new Date(s.iniciado_em);
        const dataStr = data.toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' });
        const partes = [
          s.duracao_min ? `${s.duracao_min} min` : null,
          s.volume ? `${s.volume.toLocaleString('pt-BR')} kg` : null,
          s.total_series ? plural(s.total_series, 'série', 'séries') : null
        ].filter(Boolean);
        return `
          <div class="sessao-item">
            <div class="sessao-item-top">
              <div class="sessao-item-nome">${esc(s.ficha_nome || 'Treino livre')}${s.prs ? `<span class="badge-pr">${s.prs} PR</span>` : ''}</div>
              <div class="sessao-item-data">${dataStr}</div>
            </div>
            <div class="sessao-item-meta">${partes.length ? partes.join(' · ') : '—'}</div>
          </div>`;
      }).join('');
    }

    renderSemana();
    renderHoje();
    renderSequencia();
    renderUltimos();
    esconderSplash();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
    }
  </script>
<script src="/js/bottom-nav.js" defer></script>
</body>
</html>
